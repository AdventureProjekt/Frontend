<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Dagens bookinger</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="medarbejder.html">Dagens bookinger</a>
</nav>

<h1>Dagens bookinger</h1>

<div class="form-container">
    <div class="form-group">
        <label for="ddAktivitet">Aktivitet</label>
        <select id="ddAktivitet" class="inputfield">
            <option value="0">Alle aktiviteter</option>
        </select>
    </div>
    <div class="form-group">
        <label for="inpDato">Dato</label>
        <input type="date" id="inpDato" class="inputfield">
    </div>
</div>

<h2>Udstyr der skal gøres klar</h2>
<table id="tblUdstyr">
    <tr>
        <th>Aktivitet</th>
        <th>Udstyr</th>
        <th>Antal i alt</th>
    </tr>
</table>
<p id="txtIngenUdstyr" class="center"></p>

<h2>Bookinger</h2>
<table id="tblBookinger">
    <tr>
        <th>Nr.</th>
        <th>Tid</th>
        <th>Aktivitet</th>
        <th>Kunde</th>
        <th>Telefon</th>
        <th>Personer</th>
        <th>Yngste</th>
        <th>Udstyr</th>
    </tr>
</table>
<p id="txtOpsummering" class="center"></p>

<script type="module" src="js/medarbejder.js"></script>
</body>
</html>
