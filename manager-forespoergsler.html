<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Manager - firmaforespørgsler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="manager-bookinger.html">Bookinger</a>
    <a href="manager-forespoergsler.html">Firmaforespørgsler</a>
    <a href="admin-aktiviteter.html">Aktiviteter og udstyr</a>
    <a href="booking.html">Ny telefonbooking</a>
</nav>

<h1>Firmaforespørgsler</h1>
<p id="txtBekraeftelse" class="bekraeftelse" hidden></p>

<div class="form-container">
    <div class="form-group">
        <label for="ddStatus">Vis</label>
        <select id="ddStatus" class="inputfield">
            <option value="AFVENTER">Afventer</option>
            <option value="GODKENDT">Godkendt</option>
            <option value="AFVIST">Afvist</option>
            <option value="">Alle</option>
        </select>
    </div>
</div>

<table id="tblForespoergsler">
    <tr>
        <th>Nr.</th>
        <th>Firma</th>
        <th>Dato</th>
        <th>Deltagere</th>
        <th>Status</th>
        <th></th>
    </tr>
</table>

<div id="divDetaljer" class="form-container" hidden>
    <h2 id="txtTitel"></h2>
    <p id="txtKontakt"></p>
    <p id="txtBesked"></p>
    <p><b>Vælg en starttid for hver aktivitet:</b></p>
    <div id="divTider"></div>
    <button id="pbGodkend">Godkend</button>
    <button id="pbAfvis" class="btn1">Afvis</button>
    <button id="pbLuk" class="btn2">Luk</button>
</div>

<script type="module" src="js/manager-forespoergsler.js"></script>
</body>
</html>
