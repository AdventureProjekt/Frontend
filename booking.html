<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Book en aktivitet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="aktiviteter.html">Aktiviteter</a>
    <a href="booking.html">Book</a>
    <a href="firma.html">Firma</a>
</nav>

<h1>Book en aktivitet</h1>

<div id="divKvittering" class="kvittering" hidden>
    <div id="kvitteringIndhold"></div>
    <p>Vi glæder os til at se jer. Husk dit bookingnummer.</p>
    <button id="pbNyBooking">Lav en ny booking</button>
</div>

<div class="form-container" id="divForm">
    <form id="formBooking">
        <div class="form-group">
            <label for="ddAktivitet">Aktivitet</label>
            <select id="ddAktivitet" class="inputfield" required></select>
        </div>
        <div class="form-group">
            <label for="inpDato">Dato</label>
            <input type="date" id="inpDato" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpAntal">Antal personer</label>
            <input type="number" id="inpAntal" class="inputfield" min="1" value="1" required>
        </div>
        <div class="form-group">
            <label for="ddTid">Tid</label>
            <select id="ddTid" class="inputfield" required></select>
        </div>
        <div class="form-group">
            <label for="inpMinAlder">Alder på yngste deltager</label>
            <input type="number" id="inpMinAlder" class="inputfield" min="0" required>
        </div>
        <div class="form-group">
            <label for="inpNavn">Navn</label>
            <input type="text" id="inpNavn" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpTlfnr">Telefonnummer</label>
            <input type="text" id="inpTlfnr" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpMail">E-mail</label>
            <input type="email" id="inpMail" class="inputfield" required>
        </div>
        <button type="submit">Book</button>
    </form>
</div>

<script type="module" src="js/booking.js"></script>
</body>
</html>
