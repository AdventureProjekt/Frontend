<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Manager - bookinger</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="manager-bookinger.html">Bookinger</a>
    <a href="manager-forespoergsler.html">Firmaforespørgsler</a>
    <a href="admin-aktiviteter.html">Aktiviteter og udstyr</a>
    <a href="booking.html">Ny telefonbooking</a>
</nav>

<h1>Bookinger</h1>
<p id="txtBekraeftelse" class="bekraeftelse" hidden></p>

<div class="form-container">
    <div class="form-group">
        <label for="inpDato">Vis bookinger for dato</label>
        <input type="date" id="inpDato" class="inputfield">
    </div>
</div>

<table id="tblBookinger">
    <tr>
        <th>Nr.</th>
        <th>Tid</th>
        <th>Aktivitet</th>
        <th>Kunde</th>
        <th>Telefon</th>
        <th>Personer</th>
        <th>Yngste</th>
        <th></th>
        <th></th>
    </tr>
</table>
<p id="txtIngen" class="center"></p>

<div id="divRet" class="form-container" hidden>
    <h2 id="txtRetTitel">Ret booking</h2>
    <form id="formRet">
        <div class="form-group">
            <label for="inpRetDato">Dato</label>
            <input type="date" id="inpRetDato" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="ddRetTid">Tid</label>
            <select id="ddRetTid" class="inputfield" required></select>
        </div>
        <div class="form-group">
            <label for="inpRetAntal">Antal personer</label>
            <input type="number" id="inpRetAntal" class="inputfield" min="1" required>
        </div>
        <div class="form-group">
            <label for="inpRetMinAlder">Alder på yngste deltager</label>
            <input type="number" id="inpRetMinAlder" class="inputfield" min="0" required>
        </div>
        <button type="submit">Gem ændringer</button>
        <button type="button" id="pbAnnuller" class="btn2">Annuller</button>
    </form>
</div>

<script type="module" src="js/manager-bookinger.js"></script>
</body>
</html>
