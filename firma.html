<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Firmaarrangement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="aktiviteter.html">Aktiviteter</a>
    <a href="booking.html">Book</a>
    <a href="firma.html">Firma</a>
</nav>

<h1>Firmaarrangement</h1>
<p class="center">Send os en forespørgsel, så vender vi tilbage med tidspunkter.</p>

<div id="divKvittering" class="kvittering" hidden>
    <div id="kvitteringIndhold"></div>
    <p>Vi vender tilbage med tidspunkter. Gem jeres forespørgselsnummer, så I kan følge status herunder.</p>
    <button id="pbNyForespoergsel">Send en ny forespørgsel</button>
</div>

<div class="form-container" id="divForm">
    <form id="formFirma">
        <div class="form-group">
            <label for="inpFirmanavn">Firmanavn</label>
            <input type="text" name="firmanavn" id="inpFirmanavn" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpKontaktperson">Kontaktperson</label>
            <input type="text" name="kontaktperson" id="inpKontaktperson" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpMail">E-mail</label>
            <input type="email" name="mail" id="inpMail" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpTlfnr">Telefonnummer</label>
            <input type="text" name="tlfnr" id="inpTlfnr" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpDato">Ønsket dato</label>
            <input type="date" name="dato" id="inpDato" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpAntal">Antal deltagere</label>
            <input type="number" name="antalDeltagere" id="inpAntal" class="inputfield" min="1" required>
        </div>
        <div class="form-group">
            <label>Aktiviteter</label>
            <div id="divAktiviteter"></div>
        </div>
        <div class="form-group">
            <label for="inpBesked">Besked (valgfri)</label>
            <textarea name="besked" id="inpBesked" class="inputfield" rows="3"></textarea>
        </div>
        <button type="submit">Send forespørgsel</button>
    </form>
</div>

<h2>Se status på din forespørgsel</h2>
<div class="form-container">
    <div class="form-group">
        <label for="inpForespoergselId">Forespørgselsnummer</label>
        <input type="number" id="inpForespoergselId" class="inputfield">
    </div>
    <button id="pbVisStatus">Vis status</button>
    <p id="txtStatus"></p>
</div>

<script type="module" src="js/firma.js"></script>
</body>
</html>
