<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Manager - aktiviteter og udstyr</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Forside</a>
    <a href="manager-bookinger.html">Bookinger</a>
    <a href="manager-forespoergsler.html">Firmaforespørgsler</a>
    <a href="admin-aktiviteter.html">Aktiviteter og udstyr</a>
    <a href="booking.html">Ny telefonbooking</a>
</nav>

<h1>Aktiviteter og udstyr</h1>
<p id="txtBekraeftelse" class="bekraeftelse" hidden></p>

<div class="form-container">
    <h2 id="txtFormTitel">Opret aktivitet</h2>
    <form id="formAktivitet">
        <div class="form-group">
            <label for="inpNavn">Navn</label>
            <input type="text" name="navn" id="inpNavn" class="inputfield" required>
        </div>
        <div class="form-group">
            <label for="inpBeskrivelse">Beskrivelse</label>
            <textarea name="beskrivelse" id="inpBeskrivelse" class="inputfield" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label for="inpPris">Pris (kr.)</label>
            <input type="number" name="pris" id="inpPris" class="inputfield" min="0" required>
        </div>
        <div class="form-group">
            <label for="inpAlder">Aldersgrænse</label>
            <input type="number" name="aldersgrænse" id="inpAlder" class="inputfield" min="0" required>
        </div>
        <div class="form-group">
            <label for="inpVarighed">Varighed (minutter)</label>
            <input type="number" name="varighed" id="inpVarighed" class="inputfield" min="1" required>
        </div>
        <div class="form-group">
            <label for="inpKapacitet">Kapacitet</label>
            <input type="number" name="kapacitet" id="inpKapacitet" class="inputfield" min="1" required>
        </div>
        <div class="form-group">
            <label for="inpAabner">Åbner</label>
            <input type="time" name="aabner" id="inpAabner" class="inputfield" value="10:00" required>
        </div>
        <div class="form-group">
            <label for="inpLukker">Lukker</label>
            <input type="time" name="lukker" id="inpLukker" class="inputfield" value="18:00" required>
        </div>
        <button type="submit" id="pbGem">Opret</button>
        <button type="button" id="pbAnnuller" class="btn2" hidden>Annuller</button>
    </form>
</div>

<table id="tblAktiviteter">
    <tr>
        <th>Navn</th>
        <th>Pris</th>
        <th>Alder</th>
        <th>Varighed</th>
        <th>Kapacitet</th>
        <th>Åbent</th>
        <th></th>
        <th></th>
        <th></th>
    </tr>
</table>

<div id="divUdstyr" class="form-container" hidden>
    <h2 id="txtUdstyrTitel">Udstyr</h2>
    <p id="txtUdstyrBekraeftelse" class="bekraeftelse" hidden></p>
    <table id="tblUdstyr">
        <tr>
            <th>Udstyr</th>
            <th>Antal pr. person</th>
            <th></th>
        </tr>
    </table>

    <h3>Tilføj udstyr</h3>
    <form id="formUdstyr">
        <div class="form-group">
            <label for="inpUdstyrNavn">Navn</label>
            <input type="text" name="navn" id="inpUdstyrNavn" class="inputfield" placeholder="fx Hjelm" required>
        </div>
        <div class="form-group">
            <label for="inpUdstyrAntal">Antal pr. person</label>
            <input type="number" name="antalPrPerson" id="inpUdstyrAntal" class="inputfield" min="1" value="1" required>
        </div>
        <button type="submit">Tilføj</button>
        <button type="button" id="pbLukUdstyr" class="btn2">Luk</button>
    </form>
</div>

<script type="module" src="js/admin-aktiviteter.js"></script>
</body>
</html>
